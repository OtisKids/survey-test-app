<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Take Survey - {{ survey.title }}</title>
</head>
<body>
  <h1>{{ survey.title }}</h1>
  <form method="post">
    {% for question in survey.questions %}
      <label>{{ question }}</label><br>
      <input type="text" name="question_{{ loop.index0 }}" required><br><br>
    {% endfor %}
    <input type="submit" value="Submit Survey">
  </form>
  <p><a href="{{ url_for('survey.dashboard_surveys') }}">Back to Surveys</a></p>
</body>
</html>
