<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Take Survey - {{ survey.title }}</title>
</head>
<body>
  <h1>{{ survey.title }}</h1>
  <form method="post">
    {% for question in survey.questions %}
      <div>
        <label>{{ question.text }}</label><br>
        {% if question.type == 'likert' %}
          <select name="question_{{ loop.index0 }}" required>
            {% for option in question.scale %}
              <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
          </select>
          {% if question.note %}
            <p><small>{{ question.note }}</small></p>
          {% endif %}
        {% else %}
          <input type="text" name="question_{{ loop.index0 }}" required>
        {% endif %}
      </div>
      <br>
    {% endfor %}
    <input type="submit" value="Submit Survey">
  </form>
  <p><a href="{{ url_for('survey.catalog') }}">Back to Catalog</a></p>
</body>
</html>
