<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Edit Survey Template</title>
</head>
<body>
  <h1>Edit Survey Template</h1>
  <form method="post">
    <label>Template Title:</label><br>
    <input type="text" name="title" value="{{ template.title }}" required><br><br>
    <div id="questions">
      {% for question in template.questions %}
        <label>Question {{ loop.index }}:</label><br>
        <input type="text" name="questions[]" value="{{ question }}" required><br>
      {% endfor %}
    </div>
    <button type="button" onclick="addQuestion()">Add Question</button><br><br>
    <input type="submit" value="Save Changes">
  </form>
  <p><a href="{{ url_for('survey.dashboard_surveys') }}">Back to Survey Dashboard</a></p>

  <script>
    function addQuestion() {
      var div = document.getElementById('questions');
      var count = div.getElementsByTagName('input').length + 1;
      var label = document.createElement('label');
      label.innerHTML = 'Question ' + count + ':<br>';
      var input = document.createElement('input');
      input.type = 'text';
      input.name = 'questions[]';
      input.required = true;
      div.appendChild(label);
      div.appendChild(input);
      div.appendChild(document.createElement('br'));
    }
  </script>
</body>
</html>
